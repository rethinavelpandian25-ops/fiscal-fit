<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fiscal Fit - Financial Health Check</title>
<script>try{var t=localStorage.getItem('t')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.dataset.theme=t}catch(e){document.documentElement.dataset.theme='light'}</script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#eef3f2;--card:#fff;--ink:#0f1f2e;--mut:#5b6b78;--line:#d7e2e0;--ac:#0d9488;--on:#fff;--sh:0 14px 34px -16px rgba(15,31,46,.25);--r:18px}
[data-theme=dark]{--bg:#0a121a;--card:#111e29;--ink:#e8f1f0;--mut:#93a7b4;--line:#223545;--ac:#2dd4bf;--on:#06201d;--sh:0 14px 34px -16px #000}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 'Plus Jakarta Sans',system-ui,sans-serif;transition:background .4s,color .4s}
header{display:flex;justify-content:space-between;align-items:center;padding:14px clamp(16px,4vw,48px);position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px)}
.logo{font-weight:800;font-size:20px}.logo i{font-style:normal;color:var(--ac)}
button{font:inherit;cursor:pointer;border:0;border-radius:999px;transition:transform .2s,box-shadow .2s,background .3s}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.tg{width:52px;height:30px;background:var(--line);position:relative;padding:0}
.tg::after{content:'☀️';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:14px;transition:transform .35s}
[data-theme=dark] .tg::after{content:'🌙';transform:translateX(22px)}
.btn{background:var(--ac);color:var(--on);font-weight:800;padding:14px 28px;box-shadow:0 10px 24px -10px var(--ac)}
.btn:hover{transform:translateY(-2px)}.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--line);box-shadow:none}
main{padding:0 clamp(16px,4vw,48px) 60px;max-width:1200px;margin:auto}
.view{display:none}.view.on{display:block;animation:in .5s ease}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;min-height:72vh}
h1{font-size:clamp(34px,5.4vw,60px);line-height:1.05;margin:0 0 16px;letter-spacing:-.03em;font-weight:800}
.lead{color:var(--mut);max-width:46ch;margin:0 0 26px}
.name{display:flex;gap:10px;flex-wrap:wrap}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:11px 14px;transition:border .2s}
input:focus,select:focus{border-color:var(--ac)}.name input{flex:1 1 220px;width:auto;background:var(--card);padding:14px 18px;border-radius:999px}
.panel{background:var(--card);border-radius:28px;padding:28px;box-shadow:var(--sh);border:1px solid var(--line)}
.gauge{width:100%;max-width:380px;display:block;margin:auto;overflow:visible}
.trk,.val{fill:none;stroke-width:16;stroke-linecap:round}.trk{stroke:var(--line)}
.val{stroke-dasharray:100;stroke-dashoffset:100;transition:stroke-dashoffset 1.8s cubic-bezier(.2,.8,.2,1)}
.num{font-size:40px;font-weight:800;text-anchor:middle;fill:var(--ink)}.of{font-size:9px;text-anchor:middle;fill:var(--mut)}
.pill{display:inline-block;padding:6px 16px;border-radius:999px;font-weight:800;background:var(--lc,var(--ac));color:#fff}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:6px}.bar b{display:block;height:100%;width:0;background:var(--lc);border-radius:9px;transition:width 1.4s cubic-bezier(.2,.8,.2,1)}
.fh{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin:24px 0 6px}
.fh h2{margin:0;font-size:clamp(24px,3.4vw,34px);letter-spacing:-.02em}.prog{flex:1 1 220px;max-width:340px;font-size:13px;color:var(--mut)}.prog .bar b{background:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,310px),1fr));gap:18px;margin-top:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--sh)}
.card h3{margin:0 0 14px;font-size:18px;display:flex;gap:10px;align-items:center}.card h3 span{width:38px;height:38px;border-radius:12px;background:var(--bg);display:grid;place-items:center}
.fields{display:grid;gap:12px}label{font-size:13px;font-weight:600;color:var(--mut);display:block}label input,label select{margin-top:5px}
.chk{display:flex;gap:10px;align-items:center;background:var(--bg);padding:11px 14px;border-radius:12px;color:var(--ink);cursor:pointer}.chk input{width:20px;height:20px;margin:0;accent-color:var(--ac)}
[hidden]{display:none!important}.act{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:28px}
.err{color:#ef4444;text-align:center;margin-top:12px;min-height:24px;font-weight:600}.shake{animation:sh .4s}@keyframes sh{30%{transform:translateX(-8px)}60%{transform:translateX(8px)}}
#result{--lc:var(--ac)}.top{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:center}
.top h2{font-size:clamp(26px,4vw,40px);margin:10px 0}.sc{margin-top:14px}.sc small{color:var(--mut)}.sc div{display:flex;justify-content:space-between;font-weight:600;font-size:14px}
#result[data-l="0"] .gauge{animation:pulse 1.4s infinite}#result[data-l="3"] .gauge{animation:glow 2.2s infinite}
@keyframes pulse{50%{filter:drop-shadow(0 0 14px #ef4444aa)}}@keyframes glow{50%{filter:drop-shadow(0 0 16px #00b894aa)}}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin:20px 0}.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.tile small{color:var(--mut);display:block}.tile b{font-size:22px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.flow{display:flex;height:16px;border-radius:9px;overflow:hidden;margin:10px 0 6px}.flow i{transition:flex 1.4s;flex:0}
.cg{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:18px}.cg canvas{max-height:280px}
.tips{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px;margin-top:16px}
.tipc{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--p);border-radius:var(--r);padding:18px;opacity:0;transform:translateY(18px);animation:in .6s forwards}
.tipc h4{margin:0 0 6px}.tipc em{font-style:normal;font-size:12px;font-weight:800;color:var(--p)}.tipc p{margin:0;color:var(--mut);font-size:14.5px}
h2.sec{margin:34px 0 4px}.note{color:var(--mut)}
@media(max-width:820px){.hero,.top{grid-template-columns:1fr;min-height:0;padding-top:20px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.tipc{opacity:1;transform:none}}

.ws{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px;align-items:end}.ws label b{float:right;color:var(--ink)}
input[type=range]{padding:0;height:6px;accent-color:var(--ac);border:0;margin-top:14px;cursor:pointer}
.out small{display:block;color:var(--mut)}.out b{font-size:34px;transition:color .4s}.out span{margin-left:8px;font-weight:700;color:var(--mut)}
.cf{position:fixed;top:-14px;width:9px;height:14px;z-index:9;border-radius:2px;animation:fall 2.6s ease-in forwards;pointer-events:none}
@keyframes fall{to{transform:translate(var(--x),105vh) rotate(720deg)}}@media(prefers-reduced-motion:reduce){.cf{display:none}}
</style></head><body>
<header><div class="logo">Fiscal<i>Fit</i></div><button class="tg" id="tg" aria-label="Toggle light and dark theme"></button></header>
<main>
<section class="view on" id="landing"><div class="hero"><div>
<h1>Is your money healthy? Find out in 3 minutes.</h1>
<p class="lead">Answer a few simple questions and get a clear score, colour-coded verdict, smart tips and a PDF plan to improve.</p>
<form class="name" id="nf"><input id="nm" placeholder="What should we call you?" maxlength="40" autocomplete="given-name" aria-label="Your name"><button class="btn">Start my check</button></form>
</div><div class="panel"><div id="demo"></div><p class="note" style="text-align:center;margin:8px 0 0">Your score, live from your answers</p></div></div></section>

<section class="view" id="form"><div class="fh"><h2 id="hi"></h2><div class="prog"><span id="pt">0% complete</span><div class="bar"><b id="pb"></b></div></div></div>
<p class="note">Fill what you know. Leave the rest at 0. Amounts are in ₹.</p>
<div class="grid" id="grid"></div><div class="err" id="err"></div>
<div class="act"><button class="btn alt" id="back">Back</button><button class="btn alt" id="clr">Clear saved answers</button><button class="btn" id="go">Analyse my finances</button></div></section>

<section class="view" id="result"></section>
</main>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const H=[['rent','Monthly rent (₹)','n','rent'],['home_price','Home price (₹)','n','own,loan'],['loan_out','Loan outstanding (₹)','n','loan'],['loan_rate','Loan interest rate (% a year)','n','loan'],['emi','Monthly home loan EMI (₹)','n','loan'],['loan_years','Years left on loan','n','loan']];
const S=[['About you','🙋',[['age','Your age','n'],['salary','Monthly salary (₹)','n'],['passive','Passive income a month (rent, dividends, side income)','n']]],
['Monthly expenses','🧾',[['food','Food and groceries'],['transport','Transport and fuel'],['utilities','Bills, phone, internet'],['health','Medical and health'],['education','Education and kids'],['entertainment','Entertainment and travel'],['shopping','Shopping'],['other','Other expenses']].map(a=>[...a,'n'])],
['Your home','🏠',[['housing','Where do you live?','s',[['rent','Rented house'],['own','Own house, no loan'],['loan','Own house with home loan']]],...H]],
['Savings and investments','💰',[['emergency','Cash in emergency fund (₹)'],['fd','Fixed deposits (₹)'],['stocks','Stocks and mutual funds (₹)'],['sip','SIP amount a month (₹)'],['sip_years','SIP duration (years)'],['sip_ret','Expected SIP return (% a year)']].map(a=>[...a,'n'])],
['Insurance','🛡️',[['term','I have a term life plan','c'],['health_ins','I have health insurance','c'],['parents','My parents are insured','c'],['cover','Total life cover (₹)','n']]],
['Other assets and debts','🏦',[['land','Land value (₹)'],['gold','Gold value (₹)'],['other_assets','Other assets (₹)'],['other_debt','Other debts: cards, personal loans (₹)'],['debt_emi','Monthly EMIs for those debts (₹)']].map(a=>[...a,'n'])]];
let D={},R=null,CH=[];
const fld=([id,l,t,o,sh])=>t=='c'?`<label class="chk"><input type="checkbox" id="${id}"><span>${l}</span></label>`:t=='s'?`<label>${l}<select id="${id}">${o.map(([v,x])=>`<option value="${v}">${x}</option>`).join('')}</select></label>`:`<label ${sh?`data-show="${sh}"`:''}>${l}<input id="${id}" type="number" min="0" inputmode="decimal" placeholder="0"></label>`;
$('#grid').innerHTML=S.map(([t,i,f])=>`<section class="card"><h3><span>${i}</span>${t}</h3><div class="fields">${f.map(fld).join('')}</div></section>`).join('');
const ids=S.flatMap(s=>s[2]);
function sync(){const h=$('#housing').value;$$('[data-show]').forEach(e=>e.hidden=!e.dataset.show.split(',').includes(h));
 const n=ids.filter(f=>f[2]=='n'&&!(f[3]&&0)),d=n.filter(f=>$('#'+f[0]).value!=='').length;const p=Math.round(100*d/n.length);$('#pt').textContent=p+'% complete';$('#pb').style.width=p+'%'}
const SV=()=>{try{localStorage.setItem('ff',JSON.stringify(Object.fromEntries(ids.map(([i,,t])=>[i,t=='c'?$('#'+i).checked:$('#'+i).value]))))}catch(e){}};
try{const s=JSON.parse(localStorage.getItem('ff')||'{}');ids.forEach(([i,,t])=>{if(i in s){t=='c'?$('#'+i).checked=s[i]:$('#'+i).value=s[i]}})}catch(e){}
$('#clr').onclick=()=>{try{localStorage.removeItem('ff')}catch(e){}location.reload()};
$('#grid').addEventListener('input',()=>{sync();SV()});$('#grid').addEventListener('change',sync);
const show=v=>{$$('.view').forEach(e=>e.classList.toggle('on',e.id==v));scrollTo({top:0,behavior:'smooth'})};
const gauge=k=>`<svg class="gauge" viewBox="0 0 200 120"><defs><linearGradient id="g${k}" x1="0" x2="1"><stop offset="0" stop-color="#ef4444"/><stop offset=".5" stop-color="#f59e0b"/><stop offset="1" stop-color="#22c55e"/></linearGradient></defs><path d="M20 100A80 80 0 0 1 180 100" class="trk"/><path d="M20 100A80 80 0 0 1 180 100" class="val" pathLength="100" stroke="url(#g${k})"/><text x="100" y="90" class="num">0</text><text x="100" y="112" class="of">out of 100</text></svg>`;
function fill(box,s){const v=box.querySelector('.val'),n=box.querySelector('.num'),a=+n.textContent,t=performance.now();v.style.strokeDashoffset=100-s;
 (function f(now){const p=Math.min(1,(now-t)/1500);n.textContent=Math.round(a+(s-a)*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(t)}
$('#demo').innerHTML=gauge('d');let di=0;const dv=[34,62,88];const dm=()=>fill($('#demo'),dv[di++%3]);setTimeout(dm,300);setInterval(dm,3200);
$('#nf').onsubmit=e=>{e.preventDefault();D.name=$('#nm').value.trim()||'Friend';$('#hi').textContent=`Hi ${D.name}, tell us about your money`;sync();show('form')};
$('#back').onclick=()=>show(R?'result':'landing');
const num=v=>parseFloat(v)||0;
$('#go').onclick=async()=>{ids.forEach(([id,,t])=>D[id]=t=='c'?$('#'+id).checked:t=='s'?$('#'+id).value:num($('#'+id).value));
 if(D.age<18||D.salary<=0){$('#err').textContent='Please enter your age (18+) and monthly salary to continue.';const g=$('#grid');g.classList.remove('shake');void g.offsetWidth;g.classList.add('shake');return}
 $('#err').textContent='';$('#go').textContent='Analysing...';
 try{R=await(await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(D)})).json();render()}catch(e){$('#err').textContent='Could not reach the server. Please try again.'}
 $('#go').textContent='Analyse my finances'};
const inr=x=>'₹'+Math.round(x).toLocaleString('en-IN');
function render(){const r=R,m=r.m,V=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim(),box=$('#result');
 box.dataset.l=r.level;box.style.setProperty('--lc',r.color);
 const col=(v,g,y)=>v>=g?'#22c55e':v>=y?'#f59e0b':'#ef4444',need=m.spend+m.debt,tot=Math.max(m.income,need),sv=Math.max(0,m.save);
 box.innerHTML=`<div class="top" style="margin-top:20px"><div class="panel">${gauge('r')}</div><div><span class="pill">${r.label}</span><small id="dl" class="note" style="margin-left:10px;font-weight:700"></small><h2>${D.name}, your score is ${r.score}/100</h2><p class="lead">${r.blurb}</p>
 <div class="act" style="justify-content:start;margin:0"><button class="btn" id="pdf">Download PDF report</button><button class="btn alt" id="ed">Edit answers</button></div></div></div>
 <div class="tiles"><div class="tile"><small>Monthly savings</small><b><span class="dot" style="background:${col(m.sr,.2,.1)}"></span>${inr(m.save)}</b></div>
 <div class="tile"><small>Emergency cover</small><b><span class="dot" style="background:${col(m.em,6,3)}"></span>${m.em.toFixed(1)} months</b></div>
 <div class="tile"><small>Debt to income</small><b><span class="dot" style="background:${col(.5-m.dti,.15,.05)}"></span>${(m.dti*100).toFixed(0)}%</b></div>
 <div class="tile"><small>Net worth</small><b><span class="dot" style="background:${col(m.nw/(m.target||1),1,.4)}"></span>${inr(m.nw)}</b></div></div>
 <div class="card"><b>Where your income goes</b><div class="flow"><i id="f1" style="background:#6366f1"></i><i id="f2" style="background:#f59e0b"></i><i id="f3" style="background:#22c55e"></i></div><small class="note">Spending ${inr(m.spend)} · Debt EMIs ${inr(m.debt)} · Saved ${inr(sv)}</small>${r.loan_note?`<p style="margin:10px 0 0">🏠 ${r.loan_note}</p>`:''}</div>
 <h2 class="sec">Score breakdown</h2><div class="grid">${r.subs.map(s=>`<div class="card"><div style="display:flex;justify-content:space-between"><b>${s.name}</b><b>${s.score}</b></div><div class="bar"><b data-w="${s.score}"></b></div><small class="note">${s.note}</small></div>`).join('')}</div>
 <h2 class="sec">Charts</h2><div class="cg"><div class="card"><b>Expenses split</b><canvas id="c1"></canvas></div>${r.sip.years?'<div class="card"><b>SIP growth</b><canvas id="c2"></canvas><small class="note">'+inr(r.sip.invested)+' invested could grow to about '+inr(r.sip.fv)+'</small></div>':''}</div>
 <h2 class="sec">Smart tips for you</h2><div class="tips">${r.tips.map((t,i)=>{const p=['#ef4444','#f59e0b','#22c55e'][t.p];return`<div class="tipc" style="--p:${p};animation-delay:${.9+i*.12}s"><em>${['URGENT','IMPORTANT','NICE TO HAVE'][t.p]}</em><h4>${t.icon} ${t.title}</h4><p>${t.text}</p></div>`}).join('')}</div>
 <h2 class="sec">Try a what-if</h2><div class="card"><div class="ws">
 <label>Extra SIP a month <b id="vx">₹0</b><input type="range" id="sx" min="0" max="${Math.round(Math.max(5000,m.income*.3)/500)*500}" step="500" value="0"></label>
 <label>Cut food and wants by <b id="vc">0%</b><input type="range" id="sc" min="0" max="30" step="5" value="0"></label>
 <label>Extra income a month <b id="ve">₹0</b><input type="range" id="se" min="0" max="25000" step="1000" value="0"></label>
 <div class="out"><small>New score</small><b id="wn">${r.score}</b><span id="wd"></span></div></div><small class="note" id="wf"></small></div>
 <h2 class="sec">Plan a goal</h2><div class="card"><div class="ws"><label>Goal amount (₹)<input id="ga" type="number" value="1000000"></label><label>Years<input id="gy" type="number" value="5"></label><label>Return % a year<input id="gr" type="number" value="12"></label><div class="out"><small>SIP needed a month</small><b id="gn"></b></div></div><small class="note" id="gx"></small></div>
 <h2 class="sec">Financial freedom</h2><div class="card"><b style="font-size:26px">${inr(r.fire.corpus)}</b> <small class="note">needed to live on investments (25x yearly spending)</small><p style="margin:8px 0 0">${r.fire.years?`At your current pace you could reach it in about <b>${r.fire.years} years</b> (age ${r.fire.age}).`:'At your current pace this is 60+ years away. Raise savings and SIP to bring it closer.'}</p></div>
 <p class="note" style="margin-top:28px">Estimates from a weighted scoring model and rule-based advice. Not licensed financial advice.</p>`;
 show('result');const g=box.querySelector('.gauge');setTimeout(()=>fill(box,r.score),150);
 setTimeout(()=>{$$('[data-w]').forEach(b=>b.style.width=b.dataset.w+'%');$('#f1').style.flex=m.spend/tot;$('#f2').style.flex=m.debt/tot;$('#f3').style.flex=sv/tot},300);
 $('#ed').onclick=()=>show('form');$('#pdf').onclick=async e=>{e.target.textContent='Preparing...';const b=await(await fetch('/api/report',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(D)})).blob(),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='financial-health-report.pdf';a.click();e.target.textContent='Download PDF report'};
 charts();extras()}
function charts(){if(!R||!$('#c1'))return;CH.forEach(c=>c.destroy());const mut=getComputedStyle(document.documentElement).getPropertyValue('--mut').trim(),e=Object.entries(R.expenses);Chart.defaults.color=mut;Chart.defaults.font.family="'Plus Jakarta Sans',sans-serif";
 CH=[new Chart($('#c1'),{type:'doughnut',data:{labels:e.map(x=>x[0]),datasets:[{data:e.map(x=>x[1]),backgroundColor:['#0d9488','#6366f1','#f59e0b','#ef4444','#8b5cf6','#06b6d4','#ec4899','#84cc16','#f97316','#64748b'],borderWidth:0}]},options:{cutout:'62%',plugins:{legend:{position:'bottom'}},animation:{duration:1500}}})];
 if($('#c2'))CH.push(new Chart($('#c2'),{type:'line',data:{labels:R.sip.series.map((_,i)=>'Y'+i),datasets:[{label:'Value',data:R.sip.series,borderColor:'#22c55e',backgroundColor:'#22c55e22',fill:true,tension:.35,pointRadius:0},{label:'Invested',data:R.sip.inv,borderColor:'#6366f1',borderDash:[5,4],pointRadius:0}]},options:{plugins:{legend:{position:'bottom'}},scales:{y:{ticks:{callback:v=>v>=1e7?(v/1e7).toFixed(1)+'Cr':v>=1e5?(v/1e5).toFixed(0)+'L':v}}},animation:{duration:1700}}}))}

function boom(){const c=['#22c55e','#2dd4bf','#f59e0b','#6366f1','#ec4899'];for(let i=0;i<48;i++){const e=document.createElement('i');e.className='cf';e.style.cssText=`left:${Math.random()*100}vw;background:${c[i%5]};animation-delay:${Math.random()*.6}s;--x:${Math.random()*200-100}px`;document.body.appendChild(e);setTimeout(()=>e.remove(),3600)}}
function extras(){
 try{const p=+localStorage.getItem('fs');if(p&&p!=R.score){const d=R.score-p;$('#dl').textContent=(d>0?'▲ +':'▼ ')+d+' since last time'}localStorage.setItem('fs',R.score)}catch(e){}
 if(R.level>=2)boom();
 let t;const up=()=>{$('#vx').textContent=inr(+$('#sx').value);$('#vc').textContent=$('#sc').value+'%';$('#ve').textContent=inr(+$('#se').value);clearTimeout(t);t=setTimeout(async()=>{
